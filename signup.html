<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – Clayberbs</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-container">
    <form class="login-box" onsubmit="handleSignup(event)">
      <h2>Create Account</h2>
      <p>Sign up to start ordering Clayberbs products</p>
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
      <p class="register-link">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>
  <script>
    function handleSignup(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      let users = JSON.parse(localStorage.getItem("users")) || [];
      if (users.find(u => u.email === email)) {
        alert("User already exists");
        return;
      }
      users.push({ email, password, orders: [] });
      localStorage.setItem("users", JSON.stringify(users));
      alert("Account created!");
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
