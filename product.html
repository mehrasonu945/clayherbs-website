<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clayberbs – Product Display</title>
  <link rel="stylesheet" href="css/product-display.css">
</head>
<body>
  <section class="product-section">
    <h1>Our Featured Product</h1>

    <div class="product-card">
      <div class="product-image">
        <img src="Images/image00003.jpeg" alt="Herbal Shampoo" />
      </div>
      <div class="product-content">
        <h2>Herbal Luxury Shampoo</h2>
        <p class="price">₹349</p>
        <p class="desc">
          Infused with essential oils & botanical extracts. Ideal for everyday hair nourishment.
        </p>
        <div class="cart-controls">
          <label for="qty">Qty:</label>
          <input type="number" id="qty" value="1" min="1" />
        </div>
        <button onclick="addToCart()">Add to Cart</button>
        <a href="checkout.html" class="view-cart">🛒 View Cart</a>
      </div>
    </div>
  </section>

  <script>
    function addToCart() {
      const qty = parseInt(document.getElementById("qty").value);
      const product = {
        id: 1,
        name: "Herbal Luxury Shampoo",
        price: 349,
        image: "assets/images/shampoo.jpg",
        qty: qty
      };

      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      const existing = cart.find(item => item.id === product.id);

      if (existing) {
        existing.qty += qty;
      } else {
        cart.push(product);
      }

      localStorage.setItem("cart", JSON.stringify(cart));
      alert("Added to cart!");
    }
  </script>
<div

</body>
</html>
